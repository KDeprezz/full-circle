<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vrijdag ZUIPEN?</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff3d6, #fff);
      overflow: hidden;
    }

    /* subtle beer wallpaper */
    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      font-size: 32px;
      line-height: 1;
      filter: blur(0.2px);
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 18px;
      padding: 24px;
      transform: rotate(-6deg) scale(1.05);
    }

    .card {
      position: relative;
      width: min(620px, 92vw);
      background: white;
      border: 1px solid #ffe0a6;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
      z-index: 2;
    }

    .emoji { font-size: 44px; line-height: 1; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p  { margin: 0 0 18px; opacity: .85; }

    /* ✅ FIX: compact arena instead of long rectangle */
    .arena-wrap {
      display: grid;
      place-items: center;
    }

    .arena {
      position: relative;
      display: inline-block;     /* key: shrink to content */
      padding: 18px 18px;
      border-radius: 16px;
      background: #fff7e6;
      border: 1px dashed #ffd48a;
      width: min(520px, 92vw);   /* still responsive */
      height: 96px;              /* tight area: just enough to run around */
      overflow: hidden;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 18px;
      cursor: pointer;
      transition: transform .15s ease;
      user-select: none;
      white-space: nowrap;
      position: absolute; /* both buttons positioned inside compact arena */
      top: 50%;
      transform: translateY(-50%);
    }

    #yes {
      left: 18px;
      background: #ff8a00;
      color: white;
      box-shadow: 0 8px 18px rgba(255,138,0,.25);
      transform: translateY(-50%) scale(1);
      z-index: 2;
    }

    #no {
      right: 18px;
      background: #f1f1f1;
      color: #333;
      z-index: 1;
    }

    .success {
      display: none;
      margin-top: 16px;
      font-size: 20px;
    }
    .sub {
      margin-top: 10px;
      opacity: .85;
      font-size: 16px;
    }

    /* beer confetti */
    .beer {
      position: fixed;
      top: -40px;
      font-size: 26px;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 3;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
    }
    @keyframes fall {
      to { transform: translateY(calc(100vh + 80px)) rotate(540deg); opacity: 0.95; }
    }

    /* little toast pop */
    .toast {
      position: fixed;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      opacity: 0;
      pointer-events: none;
      animation: pop 850ms ease-out forwards;
      z-index: 4;
    }
    @keyframes pop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.8); }
      20%  { opacity: 1; transform: translate(-50%, -70%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -150%) scale(1.2); }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true" id="bg"></div>

  <div class="card">
    <div class="emoji">🍻</div>
    <h1>Gaan we keihard zuipen vrijdag?</h1>
    <p id="hint">Kies nu. (en lieg niet)</p>

    <div class="arena-wrap">
      <div class="arena" id="arena" aria-label="keuze">
        <button id="yes">JA, volle bak 🍺</button>
        <button id="no">nee ik doe rustig 😇</button>
      </div>
    </div>

    <div class="success" id="success">
      <div><strong>LETSGOOOOOO</strong> 🥶🍻🍻🍻</div>
      <div class="sub">Oké dan. Vrijdag: absolute degeneracy. Ik verwacht iedereen.</div>
    </div>
  </div>

  <script>
    // build beer wallpaper
    const bg = document.getElementById("bg");
    const tiles = 120;
    const icons = ["🍺","🍻","🥃","🍾","🥂","🔥","🧃"]; // last one for the "one responsible guy"
    for (let i = 0; i < tiles; i++) {
      const s = document.createElement("span");
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.opacity = (Math.random() * 0.6 + 0.2).toFixed(2);
      s.style.transform = `rotate(${(Math.random()*20-10).toFixed(1)}deg)`;
      bg.appendChild(s);
    }

    const arena = document.getElementById("arena");
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const success = document.getElementById("success");
    const hint = document.getElementById("hint");

    let yesScale = 1;

    function rand(min, max) { return Math.random() * (max - min) + min; }

    function popToast() {
      const el = document.createElement("div");
      el.className = "toast";
      const popIcons = ["🍻","🍺","🥃","🍾","🔥","😈"];
      el.textContent = popIcons[Math.floor(Math.random() * popIcons.length)];
      el.style.left = `${rand(35, 65)}%`;
      el.style.top  = `${rand(45, 60)}%`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function beerRain(count = 18) {
      const fallIcons = ["🍺","🍻","🥃","🍾","🥂"];
      for (let i = 0; i < count; i++) {
        const b = document.createElement("div");
        b.className = "beer";
        b.textContent = fallIcons[Math.floor(Math.random() * fallIcons.length)];
        b.style.left = `${rand(0, 100)}vw`;
        b.style.animationDuration = `${rand(1.4, 2.6)}s`;
        b.style.opacity = `${rand(0.65, 1)}`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 3000);
      }
    }

    function moveNo() {
      const rect = arena.getBoundingClientRect();

      // keep inside the compact arena
      const pad = 10;
      const maxX = rect.width - no.offsetWidth - pad;
      const maxY = rect.height - no.offsetHeight - pad;

      const x = rand(pad, Math.max(pad, maxX));
      const y = rand(pad, Math.max(pad, maxY));

      no.style.left = `${x}px`;
      no.style.top = `${y}px`;
      no.style.right = "auto"; // disable right once it starts moving

      // Yes takes over
      yesScale = Math.min(2.6, yesScale + 0.14);
      yes.style.transform = `translateY(-50%) scale(${yesScale})`;

      popToast();

      const lines = [
        "ahhh jawel 😈",
        "stop met doen 😂",
        "neeeeh gij komt mee",
        "rustig? wie is dat?",
        "vrijdag = chaos 🍻",
      ];
      hint.textContent = lines[Math.floor(Math.random() * lines.length)];
    }

    // run away triggers
    no.addEventListener("mouseenter", moveNo);
    no.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNo();
    }, { passive: false });
    no.addEventListener("click", (e) => {
      e.preventDefault();
      moveNo();
    });

    yes.addEventListener("click", () => {
      success.style.display = "block";
      arena.style.display = "none";
      hint.textContent = "Correct. Degens assemble.";
      beerRain(35);
      for (let i = 0; i < 10; i++) setTimeout(popToast, i * 90);
    });

    // start positions (make sure no is visible nicely at first)
    // (no stays right initially via CSS; after first move it becomes left/top)
  </script>
</body>
</html>
