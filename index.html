<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Friday?</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff3d6, #fff);
    }
    .card {
      width: min(560px, 92vw);
      background: white;
      border: 1px solid #ffe0a6;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }
    .emoji { font-size: 44px; line-height: 1; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 18px; opacity: .85; }

    .btns {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
      position: relative;
      height: 74px;
      padding: 6px;
      border-radius: 14px;
      background: #fff7e6;
      border: 1px dashed #ffd48a;
      overflow: hidden;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 18px;
      cursor: pointer;
      transition: transform .15s ease;
      user-select: none;
      white-space: nowrap;
    }
    #yes {
      background: #ff8a00;
      color: white;
      transform: scale(1);
      box-shadow: 0 8px 18px rgba(255,138,0,.25);
    }
    #no {
      background: #f1f1f1;
      color: #333;
      position: absolute; /* lets it “run away” */
      left: 60%;
      top: 8px;
    }

    .success {
      display: none;
      margin-top: 16px;
      font-size: 20px;
    }
    .sub {
      margin-top: 10px;
      opacity: .85;
      font-size: 16px;
    }

    /* tiny floating cheers effect */
    .toast {
      position: fixed;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      opacity: 0;
      pointer-events: none;
      animation: pop 900ms ease-out forwards;
    }
    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.8); }
      20% { opacity: 1; transform: translate(-50%, -70%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -140%) scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🍻</div>
    <h1>Gaan we keihard zuipe vrijdag?</h1>
    <p id="hint">Kies Nu.</p>

    <div class="btns" id="arena" aria-label="choices">
      <button id="yes">YES, full send 🍺</button>
      <button id="no">howmow 😇</button>
    </div>

    <div class="success" id="success">
      <div><strong>LET’S GOOOOO</strong> 🥶🍻</div>
      <div class="sub">Lekker mwan.</div>
    </div>
  </div>

  <script>
    const arena = document.getElementById("arena");
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const success = document.getElementById("success");
    const hint = document.getElementById("hint");

    let yesScale = 1;

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnToast() {
      const el = document.createElement("div");
      const icons = ["🍻","🍺","🥃","🍾","🥂","🔥"];
      el.className = "toast";
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = `${rand(35, 65)}%`;
      el.style.top = `${rand(45, 60)}%`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function moveNo() {
      const rect = arena.getBoundingClientRect();

      // Keep the button inside the arena
      const maxX = rect.width - no.offsetWidth - 6;
      const maxY = rect.height - no.offsetHeight - 6;

      const x = rand(6, Math.max(6, maxX));
      const y = rand(6, Math.max(6, maxY));

      no.style.left = `${x}px`;
      no.style.top = `${y}px`;

      // “Yes takes over”
      yesScale = Math.min(2.35, yesScale + 0.12);
      yes.style.transform = `scale(${yesScale})`;

      // Make it fun
      spawnToast();

      // Update the prompt a bit
      const lines = [
        "c’monnn 😏",
        "Niet liegen 😂",
        "stop met proberen",
        "verantwoordelijkheid is saai",
        "Vrijdag belt! 📞",
      ];
      hint.textContent = lines[Math.floor(Math.random() * lines.length)];
    }

    no.addEventListener("mouseenter", moveNo);
    no.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNo();
    }, { passive: false });
    no.addEventListener("click", (e) => {
      e.preventDefault();
      moveNo();
    });

    yes.addEventListener("click", () => {
      success.style.display = "block";
      arena.style.display = "none";
      hint.textContent = "Juiste keuze.";
      for (let i = 0; i < 10; i++) setTimeout(spawnToast, i * 90);
    });
  </script>
</body>
</html>
